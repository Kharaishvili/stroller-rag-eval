[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stroller-rag-eval"
version = "0.1.0"
description = "A RAG evaluation framework for synthetic product manuals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0,<0.6.0",
    "langchain>=0.2.17,<0.3.0",
    "langchain-core>=0.2.43,<0.3.0",
    "langchain-chroma>=0.1.4,<0.2.0",
    "langchain-community>=0.2.19,<0.3.0",
    "langchain-openai>=0.1.25,<0.2.0",
    "langchain-text-splitters>=0.2.4,<0.3.0",
    "pandas>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
]
eval = [
    "datasets>=4.0.0,<5.0.0",
    "deepeval>=4.0.0,<5.0.0",
    "ragas==0.4.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
